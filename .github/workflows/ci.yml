name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Test, lint, and build gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6
      - name: Install pinned API 35 tooling
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify wrapper and toolchain
        run: ./gradlew --no-daemon --version
      - name: Run required gate
        run: ./gradlew --no-daemon test lint assembleDebug assembleRelease
      - name: Enforce contract coverage
        run: python3 scripts/verify_contract_coverage.py
      - name: Upload test, lint, and build reports
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ci-reports-${{ github.run_id }}
          path: |
            app/build/test-results/**
            app/build/reports/**
            build/reports/contract-coverage.json
          if-no-files-found: error
          retention-days: 14
