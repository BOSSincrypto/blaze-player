name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Test, lint, and build gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6
      - name: Install pinned API 35 tooling
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify wrapper and toolchain
        run: ./gradlew --no-daemon --version
      - name: Run required gate
        run: ./gradlew --no-daemon test lint assembleDebug assembleRelease
      - name: Enforce contract coverage
        run: python3 scripts/verify_contract_coverage.py
      - name: Validate exact APKs and generate provenance
        env:
          GRADLE_VERSION: '8.11.1'
          AGP_VERSION: '8.7.3'
          KOTLIN_VERSION: '2.0.21'
          JAVA_VERSION: '17'
        run: |
          mkdir -p build/artifacts
          python3 scripts/validate_apk_artifacts.py \
            --debug app/build/outputs/apk/debug/app-debug.apk \
            --release app/build/outputs/apk/release/app-release-unsigned.apk \
            --output build/artifacts/metadata.json
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/
          cp app/build/outputs/apk/release/app-release-unsigned.apk build/artifacts/
      - name: Rebuild for reproducibility comparison
        env:
          GRADLE_VERSION: '8.11.1'
          AGP_VERSION: '8.7.3'
          KOTLIN_VERSION: '2.0.21'
          JAVA_VERSION: '17'
        run: |
          ./gradlew --no-daemon --rerun-tasks assembleDebug assembleRelease
          python3 scripts/validate_apk_artifacts.py \
            --debug app/build/outputs/apk/debug/app-debug.apk \
            --release app/build/outputs/apk/release/app-release-unsigned.apk \
            --output build/reproducibility/metadata.json
          python3 scripts/check_reproducibility.py \
            build/artifacts/metadata.json build/reproducibility/metadata.json
      - name: Upload validated APKs, checksums, and metadata
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: blaze-player-apks-${{ github.run_id }}
          path: |
            build/artifacts/app-debug.apk
            build/artifacts/app-release-unsigned.apk
            build/artifacts/SHA256SUMS
            build/artifacts/metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload test, lint, and build reports
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ci-reports-${{ github.run_id }}
          path: |
            app/build/test-results/**
            app/build/reports/**
            build/reports/contract-coverage.json
            build/reproducibility/metadata.json
            build/reproducibility/report.json
          if-no-files-found: warn
          retention-days: 14
