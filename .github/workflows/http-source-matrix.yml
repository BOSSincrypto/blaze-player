name: HTTP source matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-http-matrix:
    name: Fake HTTP redirects, ranges, auth, cache
    runs-on: ubuntu-24.04
    steps:
      # Immutable action revisions keep the validation entry point auditable.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6
      - name: Install required Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run required CI gate
        run: ./gradlew --no-daemon test lint assembleDebug assembleRelease
      - name: Run the single fake HTTP matrix
        env:
          GITHUB_ACTIONS: 'true'
          ANDROID_GATE_PASSED: 'true'
          HTTP_MATRIX_REPORT: build/reports/http-source-matrix.json
        run: python3 scripts/http_source_matrix.py
      - name: Upload matrix report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: http-source-matrix-${{ github.run_id }}
          path: build/reports/http-source-matrix.json
          retention-days: 14
