name: Walking skeleton CI follow-up

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  walking-skeleton-followup:
    name: Deferred walking-skeleton component validation
    runs-on: ubuntu-24.04
    steps:
      # Immutable action revisions keep the validation entry point auditable.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install required Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Require JDK 17 and Android API 31+
        shell: bash
        run: |
          set -euo pipefail
          test "$(java -version 2>&1 | sed -n 's/.*version \"\(17\)\..*/\1/p')" = "17"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is not configured}}"
          find "$sdk_root/platforms" -maxdepth 1 -type d -name 'android-*' \
            | sed -n 's#^.*/android-##p' | awk '$1 >= 31 { found=1 } END { exit(found ? 0 : 1) }' || {
            echo "Android API 31+ is required; no compatible platform was found" >&2
            exit 1
          }
      - name: Run deferred component tests once and snapshot XML
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/deferred-test-evidence/source-policy \
            build/reports/deferred-test-evidence/autoplay

          # Clear stale live reports once, then snapshot the two exact outputs
          # from the single combined test invocation.
          if [[ -d app/build/test-results/testDebugUnitTest ]]; then
            find app/build/test-results/testDebugUnitTest -type f -delete
            find app/build/test-results/testDebugUnitTest -depth -type d -empty -delete
          fi
          source_policy_source='app/build/test-results/testDebugUnitTest/TEST-com.blaze.player.source.SourcePolicyTest.xml'
          autoplay_source='app/build/test-results/testDebugUnitTest/TEST-com.blaze.player.playback.AutoplayTransitionControllerTest.xml'
          source_policy_destination='build/reports/deferred-test-evidence/source-policy/TEST-com.blaze.player.source.SourcePolicyTest.xml'
          autoplay_destination='build/reports/deferred-test-evidence/autoplay/TEST-com.blaze.player.playback.AutoplayTransitionControllerTest.xml'
          find build/reports/deferred-test-evidence/source-policy \
            build/reports/deferred-test-evidence/autoplay -type f -delete

          set +e
          ./gradlew --no-daemon --rerun-tasks testDebugUnitTest \
            --tests 'com.blaze.player.source.SourcePolicyTest' \
            --tests 'com.blaze.player.playback.AutoplayTransitionControllerTest'
          test_status=$?
          set -e

          snapshot_status=0
          source_policy_count=$(find app/build/test-results/testDebugUnitTest -type f \
            -name 'TEST-com.blaze.player.source.SourcePolicyTest.xml' | wc -l)
          autoplay_count=$(find app/build/test-results/testDebugUnitTest -type f \
            -name 'TEST-com.blaze.player.playback.AutoplayTransitionControllerTest.xml' | wc -l)
          if (( source_policy_count != 1 )); then
            printf 'Expected exactly one source: %s\n' "$source_policy_source" >&2
            snapshot_status=1
          fi
          if (( autoplay_count != 1 )); then
            printf 'Expected exactly one source: %s\n' "$autoplay_source" >&2
            snapshot_status=1
          fi
          if (( snapshot_status == 0 )); then
            install -m 0444 -- "$source_policy_source" "$source_policy_destination"
            install -m 0444 -- "$autoplay_source" "$autoplay_destination"
          fi
          if (( test_status != 0 || snapshot_status != 0 )); then
            exit 1
          fi

      - name: Verify deferred test XML snapshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_reports=()
          while IFS= read -r -d '' report; do
            source_reports+=("$report")
          done < <(find build/reports/deferred-test-evidence/source-policy -type f \
            -name 'TEST-com.blaze.player.source.SourcePolicyTest.xml' -print0)
          if (( ${#source_reports[@]} != 1 )); then
            printf 'Expected exactly one SourcePolicyTest XML report, found %s\n' \
              "${#source_reports[@]}" >&2
            printf '%s\n' "${source_reports[@]}" >&2
            exit 1
          fi
          autoplay_reports=()
          while IFS= read -r -d '' report; do
            autoplay_reports+=("$report")
          done < <(find build/reports/deferred-test-evidence/autoplay -type f \
            -name 'TEST-com.blaze.player.playback.AutoplayTransitionControllerTest.xml' -print0)
          if (( ${#autoplay_reports[@]} != 1 )); then
            printf 'Expected exactly one AutoplayTransitionControllerTest XML report, found %s\n' \
              "${#autoplay_reports[@]}" >&2
            printf '%s\n' "${autoplay_reports[@]}" >&2
            exit 1
          fi
      - name: Run fake HTTP data-source component test once
        continue-on-error: true
        env:
          GITHUB_ACTIONS: 'true'
          HTTP_MATRIX_REPORT: build/reports/http-source-matrix.json
        run: python3 scripts/http_source_matrix.py
      - name: Record deferred assertion evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/record_walking_skeleton_followup.py
      - name: Upload follow-up evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: walking-skeleton-followup-${{ github.run_id }}
          path: |
            build/reports/http-source-matrix.json
            build/reports/walking-skeleton-followup/evidence.json
            build/reports/deferred-test-evidence/**
            app/build/test-results/**
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
